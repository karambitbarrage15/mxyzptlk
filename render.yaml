services:
  # Backend API
  - type: web
    name: windsight-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ELEXON_BASE_URL
        value: https://data.elexon.co.uk/bmrs/api/v1
    healthCheckPath: /health

  # Frontend SPA (if deployed on Render)
  - type: web
    name: windsight-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
